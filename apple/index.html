<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pomme Sweet Pomme · Devtober J01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #6b4a72; --ink2: #4a3352; --paper: #fff6ea; --pink: #f9b4cc; --pinkD: #e584a8; --lav: #cdb9f2; --lavD: #a28ad9; --gold: #f7d774; --px: 4px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: "Pixelify Sans", ui-monospace, monospace; color: var(--ink2); display: flex; flex-direction: column; height: 100dvh;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.7) 0, transparent 35%),
      radial-gradient(circle at 90% 95%, rgba(214,196,255,.8) 0, transparent 45%),
      repeating-conic-gradient(#fbd6e6 0 25%, #f7cadd 0 50%) 0 0 / 28px 28px;
    -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; }

  header { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; }
  header .side { display: flex; gap: 8px; align-items: center; }
  h1.title { margin: 0; font-size: 22px; font-weight: 700; color: var(--ink2); text-shadow: 2px 2px 0 #fff; letter-spacing: .02em; white-space: nowrap; }
  h1.title span { color: var(--pinkD); }
  .pill { font-size: 15px; color: var(--ink2); background: var(--paper); border: 3px solid var(--ink); border-radius: 8px; padding: 4px 10px;
    box-shadow: 3px 3px 0 var(--ink); text-decoration: none; cursor: pointer; white-space: nowrap; }
  .pill:hover { background: #fff; }
  .pill:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  .app { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 22px; padding: 6px 16px 16px; }
  .panel { width: 272px; flex: none; max-height: 100%; overflow: auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px;
    box-shadow: 5px 5px 0 var(--ink); padding: 14px; scrollbar-width: thin; }
  .panel h3 { margin: 14px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--lavD); }

  .console { flex: none; background: linear-gradient(160deg, #eadfff, #cdb9f2 70%); border: 3px solid var(--ink); border-radius: 18px 18px 60px 18px;
    padding: 16px 16px 12px; box-shadow: 6px 6px 0 var(--ink), inset -6px -6px 0 rgba(162,138,217,.35), inset 6px 6px 0 rgba(255,255,255,.5); }
  .lcd { position: relative; background: #5d4b7c; border-radius: 10px 10px 30px 10px; padding: 14px 20px 12px; box-shadow: inset 3px 3px 0 rgba(0,0,0,.25); }
  .lcd .topline { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .14em; color: #c9b8e8; margin: -6px 0 6px; white-space: nowrap; }
  .lcd .topline::before, .lcd .topline::after { content: ""; flex: 1; height: 2px; background: #f9b4cc; opacity: .7; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: #ff7fa8; box-shadow: 0 0 8px #ff7fa8; position: absolute; left: 7px; top: 50%; }
  .screenwrap { position: relative; line-height: 0; }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: crosshair; border-radius: 2px; }
  .screenwrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--grid, .9);
    background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: var(--px) var(--px); }
  .brandline { display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px; padding: 0 6px; }
  .brandline b { font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: .04em; font-style: italic; }
  .brandline b i { color: var(--pinkD); }
  .brandline span { font-size: 11px; color: var(--ink); opacity: .7; letter-spacing: .1em; }
  #toast { position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 8px); background: var(--paper); color: var(--ink2); border: 3px solid var(--ink);
    border-radius: 8px; padding: 6px 12px; font-size: 15px; box-shadow: 3px 3px 0 var(--ink); opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  .ph { display: flex; align-items: center; gap: 8px; }
  #name { flex: 1; min-width: 0; font: inherit; font-size: 22px; font-weight: 700; color: var(--ink2); background: transparent; border: 0; border-bottom: 3px dashed var(--pink); padding: 2px 0; outline: none; }
  #name:focus { border-bottom-color: var(--pinkD); }
  .mood { font-size: 13px; padding: 3px 8px; border-radius: 6px; background: var(--lav); border: 2px solid var(--ink); white-space: nowrap; }
  .stats { display: grid; gap: 9px; margin-top: 14px; }
  .st > span { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-bottom: 3px; }
  .st img, .res img { width: 16px; height: 16px; image-rendering: pixelated; }
  .bar { height: 16px; border: 3px solid var(--ink); border-radius: 4px; background: #fff; padding: 1px; }
  .bar i { display: block; height: 100%; width: 50%; background: repeating-linear-gradient(90deg, var(--c) 0 7px, transparent 7px 9px); transition: width .4s; }
  .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .btn { background: #fff; border: 3px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); padding: 7px 4px 5px; cursor: pointer; font-size: 15px; font-weight: 600; line-height: 1.1; }
  .btn small { display: block; font-size: 10px; font-weight: 400; opacity: .7; margin-top: 2px; }
  .btn:hover { background: #fff0f6; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.on { background: var(--pink); }
  .btn.reset { width: 100%; margin-top: 16px; background: #ffe3ec; font-size: 14px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .sw { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw button { width: 26px; height: 26px; border-radius: 6px; border: 3px solid var(--ink); cursor: pointer; padding: 0; box-shadow: 2px 2px 0 var(--ink); }
  .sw button.on { outline: 3px solid #fff; outline-offset: -7px; transform: translateY(-2px); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 4px 9px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; cursor: pointer; }
  .chip.on { background: var(--lav); }

  .res { display: flex; justify-content: space-between; gap: 6px; }
  .res span { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; background: #fff; border: 2px solid var(--ink); border-radius: 6px; padding: 4px 2px; font-size: 13px; }
  .res b { font-size: 16px; }
  .tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 12px; }
  .tool { background: #fff; border: 3px solid var(--ink); border-radius: 8px; cursor: pointer; padding: 5px 0 3px; font-size: 10px; line-height: 1.1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tool img { width: 24px; height: 24px; image-rendering: pixelated; object-fit: contain; }
  .tool.on { background: var(--pink); box-shadow: inset 0 -3px 0 var(--pinkD); }
  .hint { font-size: 14px; line-height: 1.35; margin: 12px 0 0; color: var(--ink); }
  .hint b { color: var(--pinkD); }
  .hint img { width: 12px; height: 12px; image-rendering: pixelated; vertical-align: -1px; }
  .items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .item { position: relative; background: #fff; border: 2px solid var(--ink); border-radius: 8px; cursor: pointer; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 84px; }
  .item .th { height: 48px; display: flex; align-items: center; justify-content: center; }
  .item .th img { image-rendering: pixelated; }
  .item span { font-size: 11px; line-height: 1.05; text-align: center; }
  .item em { font-style: normal; font-size: 12px; display: flex; align-items: center; gap: 2px; font-weight: 600; }
  .item em img { width: 12px; height: 12px; image-rendering: pixelated; }
  .item.on { background: #fff0f6; border-color: var(--pinkD); box-shadow: 0 0 0 2px var(--pinkD); }
  .item.poor { opacity: .45; }
  .pats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .pat { border: 2px solid var(--ink); border-radius: 6px; background: #fff; cursor: pointer; padding: 3px; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pat img { width: 32px; height: 32px; image-rendering: pixelated; border-radius: 3px; }
  .pat.on { background: var(--pink); }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 8px; }

  @media (max-width: 999px) {
    .app { flex-direction: column; justify-content: flex-start; overflow-y: auto; gap: 14px; }
    .console { order: -1; }
    .panel { width: min(560px, 100%); max-height: none; overflow: visible; }
    h1.title { font-size: 17px; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="side"></div>
  <h1 class="title">Pomme <span>Sweet</span> Pomme</h1>
  <div class="side"><button class="pill" id="mute" title="Son">♪ on</button><button class="pill" id="reset" title="Recommencer une nouvelle partie">↺ <span class="hide-sm">Nouvelle partie</span></button></div>
</header>

<main class="app">
  <aside class="panel" id="petPanel">
    <div class="ph"><input id="name" maxlength="12" spellcheck="false" aria-label="Nom du ver"><span class="mood" id="mood">Content</span></div>
    <div class="stats">
      <div class="st"><span><img id="icFaim" alt="">Ventre</span><div class="bar" style="--c:#f59ab5"><i id="bFaim"></i></div></div>
      <div class="st"><span><img id="icJoie" alt="">Joie</span><div class="bar" style="--c:#b49ce8"><i id="bJoie"></i></div></div>
      <div class="st"><span><img id="icEnergie" alt="">Énergie</span><div class="bar" style="--c:#f2c94c"><i id="bEnergie"></i></div></div>
    </div>
    <div class="acts">
      <button class="btn" id="aFeed">Nourrir<small>-1 compote</small></button>
      <button class="btn" id="aPlay">Jouer<small>-énergie</small></button>
      <button class="btn" id="aSleep">Dodo<small>au lit !</small></button>
    </div>
    <h3>Couleur du ver</h3>
    <div class="sw" id="wormColors"></div>
    <h3>Accessoire</h3>
    <div class="chips" id="accs"></div>
    <p class="hint">Clique sur ton ver pour un <b>câlin</b>. Un intérieur cosy le rend heureux.</p>
    <button class="btn reset" id="reset2">↺ Nouvelle partie</button>
  </aside>

  <section class="console">
    <div class="lcd">
      <i class="led"></i>
      <div class="topline">DOT MATRIX WITH STEREO SOUND</div>
      <div class="screenwrap"><canvas id="screen" width="240" height="216"></canvas></div>
      <div id="toast"></div>
    </div>
    <div class="brandline"><b>POMME·BOY <i>color</i></b><span>DEVTOBER J01</span></div>
  </section>

  <aside class="panel" id="homePanel">
    <div class="res">
      <span title="Compote"><img id="icCompote" alt=""><b id="rCompote">0</b></span>
      <span title="Pépins"><img id="icPepin" alt=""><b id="rPepin">0</b></span>
      <span title="Cosy"><img id="icCosy" alt=""><b id="rCosy">0</b></span>
    </div>
    <div class="tools" id="tools"></div>
    <div id="toolBody"></div>
  </aside>
</main>

<script>
/* ================= bases ================= */
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rnd = (a, b) => a + Math.random() * (b - a);
const W = 240, H = 216, T = 8, GW = 30, GH = 27, N = GW * GH;
const OUT = -1, EMPTY = 0, FLESH = 1, SKIN = 2, SEED = 3, CORE = 4;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

const C = {
  ink: '#6b4a72', ink2: '#4a3352', cream: '#fff6ea', creamD: '#ead6c0', white: '#ffffff',
  flesh: '#ffefd6', fleshS: '#f6dcb4', fleshL: '#fffaf0', core: '#f4efc4', coreS: '#e3d996',
  skin: '#f27a9b', skinL: '#ffb0c5', skinD: '#d65a82',
  seed: '#8a5a44', seedL: '#c08a6a', cave: '#f0c3cf', caveD: '#e6b0c0',
  gold: '#f7d774', goldD: '#dcae45', goldL: '#fff1b8', leaf: '#a5e3ad', leafD: '#6cbf8a',
  stem: '#a87862', flame: '#ffb36b', glow: '#fff3b0', worm: '#ffb3c1', cherry: '#ff6b8f',
};
const SW = {
  rose: ['#f9b4cc', '#e584a8', '#ffdce8'], lavande: ['#cdb9f2', '#a28ad9', '#ebe2ff'], menthe: ['#ade8d2', '#72c7a8', '#dcf7ec'],
  peche: ['#ffd1ad', '#f2a678', '#ffe9d6'], ciel: ['#b0dbf7', '#78b6e3', '#dcf0ff'], or: ['#f7d774', '#dcae45', '#fff1b8'],
  creme: ['#fff6ea', '#e8d4be', '#ffffff'],
};
const SW_KEYS = Object.keys(SW);

/* ================= pinceau pixel ================= */
function painter(g) {
  const P = {
    g,
    r(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); },
    p(x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); },
    box(x, y, w, h, f, o = C.ink) { // boîte à coins arrondis, contour 1px
      P.r(x + 1, y, w - 2, 1, o); P.r(x + 1, y + h - 1, w - 2, 1, o); P.r(x, y + 1, 1, h - 2, o); P.r(x + w - 1, y + 1, 1, h - 2, o);
      P.r(x + 1, y + 1, w - 2, h - 2, f);
    },
    disc(cx, cy, r, c) { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r) P.p(cx + x, cy + y, c); },
    pat(x, y, rows, map) { rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const c = map[row[i]]; if (c) P.p(x + i, y + j, c); } }); },
    tri(x0, x1, top, h, c) { const mid = (x0 + x1 + 1) / 2; for (let i = 0; i < h; i++) { const half = (x1 - x0 + 1) / 2 * (i + 1) / h; P.r(Math.round(mid - half), top + i, Math.max(1, Math.round(half * 2)), 1, c); } },
  };
  return P;
}
function sprite(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(painter(c.getContext('2d'))); return c; }

const HEART = ['.x.x.', 'xxxxx', 'xxxxx', '.xxx.', '..x..'];
const ICONS = {
  faim: [['..g...', '.gg.x.', 'xxxxxx', 'xxwxxx', 'xxxxxx', '.xxxx.'], { x: '#ff7f9f', w: '#fff', g: C.leafD }],
  joie: [HEART, { x: '#b49ce8' }],
  energie: [['...xx', '..xx.', '.xxxx', '..xx.', '.xx..', 'xx...'], { x: '#f2c94c' }],
  compote: [['..g...', '.oxxo.', 'oxxxxo', 'oxwxxo', 'oxxxxo', '.oooo.'], { x: '#ffd9a0', o: '#f27a9b', w: '#fff', g: C.leafD }],
  pepin: [['..o..', '.oxo.', 'oxwxo', 'oxxxo', 'oxxxo', '.ooo.'], { x: C.seed, w: C.seedL, o: C.ink2 }],
  cosy: [['.x.x.', 'xxxxx', 'xwxxx', '.xxx.', '..x..'], { x: '#ff8fb1', w: '#fff' }],
  dig: [['.oooo...', 'o.xx.o..', '..oxo...', '..o.xo..', '.....xo.', '......xo', '.......x', '........'], { o: '#a28ad9', x: C.stem }],
  place: [['..oo....', '.oxxo...', 'oxxxxo..', 'oxxxxo..', '.oxxo...', '..oo....', '.oooo...', 'oooooo..'], { o: C.ink, x: '#f9b4cc' }],
  paint: [['....oo..', '...oxxo.', '...oxxo.', '..o.oo..', '.oyo....', 'oyyo....', 'oyo.....', '.o......'], { o: C.ink, x: '#ff8fb1', y: C.stem }],
  wall: [['oooooooo', 'oxyxyxyo', 'oxyxyxyo', 'oxyxyxyo', 'oxyxyxyo', 'oooooooo'], { o: C.ink, x: '#cdb9f2', y: '#fff' }],
  erase: [['..oooo..', '.o....o.', 'oooooooo', '.oxxxxo.', '.oxxxxo.', '.oxxxxo.', '..oooo..'], { o: C.ink, x: '#ade8d2' }],
};
function iconURL(name) {
  const [rows, map] = ICONS[name];
  return sprite(Math.max(...rows.map(r => r.length)), rows.length, P => P.pat(0, 0, rows, map)).toDataURL();
}

/* ================= décorations ================= */
const ITEMS = [
  { id: 'lit', name: 'Lit douillet', w: 3, h: 2, cost: 6, mount: 'floor', cosy: 5, def: 'rose', draw(P, s) {
    P.box(0, 2, 7, 14, C.gold); P.r(1, 3, 5, 1, C.goldL); P.pat(1, 5, HEART, { x: s[0] });
    P.box(6, 8, 18, 6, C.cream);
    P.box(7, 6, 7, 4, C.white); P.r(8, 8, 5, 1, C.creamD);
    P.box(12, 7, 12, 7, s[0]); P.r(13, 8, 10, 1, s[2]); P.r(13, 12, 10, 1, s[1]); for (let x = 14; x < 22; x += 3) P.p(x, 10, s[2]);
    P.box(21, 6, 3, 10, C.gold); P.r(8, 14, 2, 2, C.ink); P.r(16, 14, 2, 2, C.ink);
  } },
  { id: 'lampe', name: 'Lampe champi', w: 1, h: 2, cost: 3, mount: 'floor', cosy: 3, def: 'rose', glow: { pts: [[4, 6]], r: 26 }, draw(P, s) {
    P.box(2, 6, 4, 8, C.cream); P.box(1, 12, 6, 4, C.creamD);
    P.box(0, 0, 8, 7, s[0]); P.r(1, 5, 6, 1, s[1]); P.p(2, 2, C.white); P.p(3, 2, C.white); P.p(5, 3, C.white); P.p(4, 1, s[2]);
  } },
  { id: 'bougie', name: 'Bougie', w: 1, h: 1, cost: 1, mount: 'floor', cosy: 1, def: 'creme', glow: { pts: [[4, 1]], r: 16 }, draw(P, s) {
    P.box(2, 3, 4, 5, s[0]); P.r(3, 4, 1, 3, s[2]); P.p(4, 2, C.ink2); P.p(4, 1, C.flame); P.p(4, 0, C.glow); P.p(3, 1, C.glow);
  } },
  { id: 'lanterne', name: 'Lanterne', w: 1, h: 1, cost: 3, mount: 'ceil', cosy: 3, def: 'or', glow: { pts: [[4, 5]], r: 24 }, draw(P, s) {
    P.r(3, 0, 2, 1, C.ink); P.r(2, 1, 4, 1, s[1]); P.box(1, 2, 6, 6, s[0]); P.r(2, 3, 4, 4, C.glow); P.r(3, 4, 2, 2, C.flame);
  } },
  { id: 'guirlande', name: 'Guirlande', w: 3, h: 1, cost: 3, mount: 'ceil', cosy: 4, def: 'rose', glow: { pts: [[3, 4], [8, 6], [13, 6], [18, 6], [22, 4]], r: 9 }, draw(P, s) {
    const yy = x => Math.round(1 + 3 * Math.sin(Math.PI * x / 23));
    for (let x = 0; x < 24; x++) P.p(x, yy(x), C.ink);
    [2, 7, 12, 17, 21].forEach((x, i) => { const y = yy(x) + 1; P.r(x, y, 2, 2, i % 2 ? C.gold : s[0]); P.p(x, y, C.white); });
  } },
  { id: 'fanions', name: 'Fanions', w: 3, h: 1, cost: 2, mount: 'ceil', cosy: 3, def: 'lavande', draw(P, s) {
    const yy = x => Math.round(1 + 2 * Math.sin(Math.PI * x / 23));
    for (let x = 0; x < 24; x++) P.p(x, yy(x), C.ink);
    [1, 7, 13, 19].forEach((x, i) => { const y = yy(x + 2) + 1, c = [s[0], C.gold, s[1], SW.menthe[0]][i]; P.r(x, y, 5, 1, c); P.r(x + 1, y + 1, 3, 1, c); P.p(x + 2, y + 2, c); });
  } },
  { id: 'plante', name: 'Plante', w: 1, h: 2, cost: 2, mount: 'floor', cosy: 2, def: 'peche', draw(P, s) {
    const L = [[4, 4, 3, C.leaf], [2, 7, 2, C.leafD], [6, 7, 2, C.leaf]];
    L.forEach(([x, y, r]) => P.disc(x, y, r + 1, C.ink)); L.forEach(([x, y, r, c]) => P.disc(x, y, r, c));
    P.p(3, 3, '#d4f5d8'); P.r(4, 8, 1, 2, C.leafD);
    P.box(1, 10, 6, 6, s[0]); P.box(0, 9, 8, 3, s[1]); P.r(2, 12, 1, 2, s[2]);
  } },
  { id: 'tulipe', name: 'Tulipes', w: 1, h: 1, cost: 1, mount: 'floor', cosy: 1, def: 'rose', draw(P, s) {
    P.pat(0, 0, ['.x.x.y.y', '.xxx.yyy', '.xxx.yyy', '..g...g.', '.gggg.g.'], { x: s[0], y: s[1], g: C.leafD });
    P.box(1, 5, 6, 3, C.cream); P.p(2, 6, C.white);
  } },

  if (wm.bedRef) { const b = wm.bedRef; wm.bedRef = null; placeWormAt(b.x + 1, b.y + 1); }
  setIdle(1); say(S.stats.energie > 90 ? 'heart' : 'sad'); if (msg) toast(msg); refreshUI();

function feed() {
  if (S.worm.sleeping) return toast('Chut… il fait dodo. 💤');
  if (S.res.compote < 1) { sfx('deny'); return toast('Plus de compote ! Creuse pour en trouver.'); }
  S.res.compote--; S.stats.faim = clamp(S.stats.faim + 18, 0, 100);
  wm.state = 'anim'; wm.anim = 'eat'; wm.timer = 1.4; wm.path = []; wm.job = null; say('apple', 1.4); sfx('eat'); refreshUI();
}
function play() {
  if (S.worm.sleeping) return toast('Chut… il fait dodo. 💤');
  if (S.stats.energie < 10) { sfx('deny'); return toast('Trop fatigué pour jouer… au lit !'); }
  S.stats.joie = clamp(S.stats.joie + 18, 0, 100); S.stats.energie = clamp(S.stats.energie - 8, 0, 100);
  wm.state = 'anim'; wm.anim = 'play'; wm.timer = 2.2; wm.path = []; wm.job = null; say('note', 2.2); sfx('play'); refreshUI();
}

function cuddle() {
  if (wm.loveCd > 0) return;
  wm.loveCd = 1.2; S.stats.joie = clamp(S.stats.joie + 4, 0, 100);
  for (let i = 0; i < 4; i++) addP('heart', wm.x + rnd(-4, 4), wm.y - 6, rnd(-8, 8), rnd(-26, -14));

const RATE = { faim: 0.022, joie: 0.018, energie: 0.011 };
function tickStats(dt) {
  const st = S.stats, sl = S.worm.sleeping;
  st.faim = clamp(st.faim - RATE.faim * dt * (sl ? 0.5 : 1), 0, 100);
  st.joie = clamp(st.joie - RATE.joie * dt + Math.min(cosyScore, 60) * 0.0004 * dt, 0, 100);
  st.energie = clamp(st.energie + (sl ? (wm.bedRef ? 0.6 : 0.3) : -RATE.energie) * dt, 0, 100);
}
function offline(sec) { // le temps passe aussi page fermée, sans jamais descendre sous 15
  sec = Math.min(sec, 12 * 3600); if (sec < 2) return;
  const st = S.stats, sl = S.worm.sleeping, floorAt = (v, d) => Math.max(Math.min(v, 15), v - d);
  st.faim = floorAt(st.faim, RATE.faim * sec * (sl ? 0.5 : 1));
  st.joie = clamp(floorAt(st.joie, RATE.joie * sec) + Math.min(cosyScore, 60) * 0.0004 * sec, 0, 100);
  st.energie = sl ? clamp(st.energie + (S.worm.bed >= 0 ? 0.6 : 0.3) * sec, 0, 100) : floorAt(st.energie, RATE.energie * sec);
}
function mood() {
  const s = S.stats;
  if (S.worm.sleeping) return 'Fait dodo';
  if (s.faim < 25) return 'Affamé';
  if (s.energie < 20) return 'Épuisé';
  if (s.joie < 25) return 'Boudeur';
  const a = (s.faim + s.joie + s.energie) / 3;
  return a > 78 ? 'Aux anges' : a > 55 ? 'Content' : 'Bof';
}

// peau dessinée au pixel près : contour rond, reflet en haut à gauche, ombre en bas à droite
function skinPixels(X, Y, h, inner = false) {
  const at = (px, py) => appleShape((px + 0.5) / T, (py + 0.5) / T);
  for (let py = Y; py < Y + T; py++) for (let px = X; px < X + T; px++) {
    if (!at(px, py)) continue;
    let c = C.skin;
    if (inner && at(px - 5, py) && at(px + 5, py) && at(px, py - 5) && at(px, py + 5)) c = (px * 7 + py * 13) % 23 ? '#fee2e1' : '#f9d0d2';
    else if (at(px - 4, py) && at(px + 4, py) && at(px, py - 4) && at(px, py + 4) && inner) c = C.skinD;
    else if (!at(px - 1, py) || !at(px + 1, py) || !at(px, py - 1) || !at(px, py + 1)) c = C.ink;
    else if (!at(px - 3, py - 3)) c = C.skinL;
    else if (!at(px + 3, py + 3)) c = C.skinD;
    TP.p(px, py, c);
  }
}
function drawTiles() {
  TP.g.clearRect(0, 0, W, H);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const t = grid[y * GW + x], X = x * T, Y = y * T, h = hash(x, y);
    if (t === OUT) { skinPixels(X, Y, h); continue; }
    if (t === EMPTY) {
      const w = S.wall[y * GW + x];
      if (w) drawPattern(TP, X, Y, w.p, SW[w.c], x, y);
      else { TP.r(X, Y, T, T, C.cave); TP.p(X + h % 8, Y + (h >> 3) % 8, C.caveD); TP.p(X + (h >> 6) % 8, Y + (h >> 9) % 8, C.caveD); }
      const sh = 'rgba(107,74,114,.22)';
      if (isSolid(x, y - 1)) TP.r(X, Y, T, 2, sh);
      if (isSolid(x - 1, y)) TP.r(X, Y, 1, T, sh);
      if (isSolid(x + 1, y)) TP.r(X + 7, Y, 1, T, sh);
      continue;
    }
    if (t === SKIN) {
      skinPixels(X, Y, h, true);
      for (const [dx, dy] of DIRS) {
        if (!isEmpty(x + dx, y + dy)) continue;
        if (dx === 1) TP.r(X + 7, Y, 1, T, C.ink); if (dx === -1) TP.r(X, Y, 1, T, C.ink);
        if (dy === 1) TP.r(X, Y + 7, T, 1, C.ink); if (dy === -1) TP.r(X, Y, T, 1, C.ink);
      }
      continue;
    }
    const core = t === CORE;
    TP.r(X, Y, T, T, core ? C.core : C.flesh);
    TP.p(X + h % 8, Y + (h >> 3) % 8, core ? C.coreS : C.fleshS);
    TP.p(X + (h >> 6) % 8, Y + (h >> 9) % 8, core ? C.coreS : C.fleshS);
    TP.p(X + (h >> 12) % 8, Y + (h >> 15) % 8, C.fleshL);
    if (core && h % 2) TP.r(X + 3, Y + (h >> 4) % 6, 1, 2, C.coreS);
    if (t === SEED) TP.pat(X + 2, Y + 1, ['.oo.', 'oxwo', 'oxxo', 'oxxo', '.oo.'], { o: C.ink2, x: C.seed, w: C.seedL });

    if (isEmpty(x + 1, y)) TP.r(X + 7, Y, 1, T, C.ink); if (isEmpty(x - 1, y)) TP.r(X, Y, 1, T, C.ink);
    if (isEmpty(x, y + 1)) TP.r(X, Y + 7, T, 1, C.ink); if (isEmpty(x, y - 1)) { TP.r(X, Y, T, 1, C.ink); TP.r(X, Y + 1, T, 1, C.fleshL); }
  }
}

function makeSky() {
  const cols = night ? ['#3e356f', '#5b4a8f', '#8b69b0', '#c58ab8'] : ['#c9b6f2', '#e6c3ee', '#fbcfe0', '#ffe2d4'];
  const B = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]]; // tramage de Bayer
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x2 = c.getContext('2d'), img = x2.createImageData(W, H);
  const rgb = cols.map(h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)));
  for (let y = 0; y < H; y++) {
    const tt = y / (H - 1) * (cols.length - 1), i = Math.min(cols.length - 2, Math.floor(tt)), f = tt - i;
    for (let x = 0; x < W; x++) {
      const col = f * 16 > B[y % 4][x % 4] ? rgb[i + 1] : rgb[i], o = (y * W + x) * 4;
      img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 255;

  }

}

function drawWorm(t) {

function drawParts(dt) {

function applyTool(x, y, first) {

    if (first) dragMode = marks.has(i) ? 'unmark' : 'mark';
    if (dragMode === 'unmark') { if (marks.delete(i)) sfx('paint'); return; }
    if (marks.has(i)) return;
    const t = tileAt(x, y);
    if (t === SKIN) { if (!skinWarned) { toast('La peau est trop dure à croquer !'); skinWarned = true; } return; }
    if (minable(t) && supportsDecor(x, y)) { if (first) toast('Ce bloc soutient un objet. Range-le d\'abord.'); return; }
    if (canMark(x, y)) {
      if (marks.size >= 60) return toast('Ton ver a déjà assez de travail !');
      marks.add(i); sfx('paint');
      if (S.worm.sleeping && first) toast('Il creusera à son réveil. 💤');
    }
  } else if (tool === 'place' && first) {
    const it = ITEM[selItem], [x0, y0] = anchor(it, x, y);
    if (!afford(it)) { sfx('deny'); return toast(it.seeds ? `Il faut ${it.seeds} pépin${it.seeds > 1 ? 's' : ''}. Cherche au cœur !` : 'Pas assez de compote ! Creuse un peu.'); }

    S.res.compote -= it.cost || 0; S.res.pepin -= it.seeds || 0;
    for (let k = 0; k < 8; k++) addP('spark', x0 * T + rnd(0, it.w * T), y0 * T + rnd(0, it.h * T), rnd(-15, 15), rnd(-25, 0));

    const d = pickDecor(x, y); if (!d) return;
    d.c = selColor; const it = ITEM[d.id];
    for (let k = 0; k < 6; k++) addP('spark', d.x * T + rnd(0, it.w * T), d.y * T + rnd(0, it.h * T), rnd(-12, 12), rnd(-20, 0));

    const d = pickDecor(x, y); if (!d) return;
    const it = ITEM[d.id];
    if (wm.bedRef === d) wake('Debout ! Son lit a disparu.');
    S.decor.splice(S.decor.indexOf(d), 1);
    S.res.compote += it.cost || 0; S.res.pepin += it.seeds || 0;
    sfx('chomp'); computeCosy(); refreshUI(); save();
  }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const { px, py, x, y } = tileFromEvent(e);
  hover.x = x; hover.y = y; hover.on = true;
  if (tool !== 'place' && tool !== 'wall' && onWorm(px, py)) return cuddle();
  down = true; skinWarned = false; cv.setPointerCapture(e.pointerId);
  applyTool(x, y, true);
});
cv.addEventListener('pointermove', e => {
  const { x, y } = tileFromEvent(e), moved = x !== hover.x || y !== hover.y;
  hover.x = x; hover.y = y; hover.on = true;
  if (down && moved && (tool === 'dig' || tool === 'wall')) applyTool(x, y, false);
});
const endDrag = () => { if (down) { down = false; dragMode = null; save(); } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', () => { if (!down) hover.on = false; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); if (tool === 'place') { flip = !flip; renderToolBody(); } });
addEventListener('keydown', e => {
  if (e.target === $('name')) return;
  if (e.key === 'f' || e.key === 'F') { flip = !flip; if (tool === 'place') renderToolBody(); }
  if (e.key === 'Escape') setTool('dig');
  const n = '12345'.indexOf(e.key); if (n >= 0) setTool(TOOLS[n][0]);
});

/* ================= interface ================= */
const TOOLS = [['dig', 'Creuser'], ['place', 'Décorer'], ['paint', 'Peindre'], ['wall', 'Papier'], ['erase', 'Ranger']];
const ICON = {};
const swatchesHTML = sel => `<div class="sw">${SW_KEYS.map(k => `<button data-col="${k}" class="${k === sel ? 'on' : ''}" style="background:${SW[k][0]}" title="${k}"></button>`).join('')}</div>`;
const thumbs = {};
const itemThumb = id => (thumbs[id + selColor] ||= itemSprite(id, selColor).toDataURL());
const patThumbs = {};
function patThumb(p) {
  const k = p === 'gomme' ? p : p + selColor;
  return (patThumbs[k] ||= sprite(16, 16, P => {
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
      if (p === 'gomme') { P.r(x * 8, y * 8, 8, 8, C.cave); P.p(x * 8 + 3, y * 8 + 4, C.caveD); }
      else drawPattern(P, x * 8, y * 8, p, SW[selColor], x, y);
    }
  }).toDataURL());
}
function renderToolBody() {
  const b = $('toolBody'), ic = n => `<img src="${ICON[n]}" alt="">`;
  if (tool === 'dig') b.innerHTML = `<p class="hint">Clique ou glisse sur les blocs de chair au bord de ta maison : <b>ton ver va les grignoter</b>. Chaque bloc donne 1 compote ${ic('compote')}.</p>
    <p class="hint">Les <b>pépins</b> ${ic('pepin')} se cachent surtout près du cœur de la pomme. Ils servent aux objets royaux.</p>
    <div class="row"><span class="hint" style="margin:0">${marks.size} bloc${marks.size > 1 ? 's' : ''} marqué${marks.size > 1 ? 's' : ''}</span><button class="btn" id="clearMarks" style="padding:5px 10px">Annuler</button></div>`;
  else if (tool === 'place') b.innerHTML = `<h3>Couleur</h3>${swatchesHTML(selColor)}
    <div class="row"><span class="hint" style="margin:0">Sens <small>(touche F)</small></span><button class="btn ${flip ? 'on' : ''}" id="flipBtn" style="padding:5px 10px">⇋ ${flip ? 'retourné' : 'normal'}</button></div>
    <div class="items">${ITEMS.map(it => `<button class="item ${it.id === selItem ? 'on' : ''} ${afford(it) ? '' : 'poor'}" data-item="${it.id}" title="${it.name}">
      <div class="th"><img src="${itemThumb(it.id)}" style="width:${Math.min(48, it.w * 16)}px;height:${Math.min(48, it.h * 16)}px;object-fit:contain" alt=""></div>
      <span>${it.name}</span><em>${it.seeds ? ic('pepin') + it.seeds : ic('compote') + it.cost}</em></button>`).join('')}</div>`;
  else if (tool === 'paint') b.innerHTML = `<h3>Couleur</h3>${swatchesHTML(selColor)}<p class="hint">Clique sur un objet pour le <b>repeindre</b>. C'est gratuit !</p>`;
  else if (tool === 'wall') b.innerHTML = `<h3>Motif</h3><div class="pats">${PATTERNS.map(([p, n]) => `<button class="pat ${p === selPat ? 'on' : ''}" data-pat="${p}"><img src="${patThumb(p)}" alt="">${n}</button>`).join('')}</div>
    <h3>Couleur</h3>${swatchesHTML(selColor)}<p class="hint">Clique ou glisse sur le <b>fond</b> de ta maison pour poser le papier peint.</p>`;
  else b.innerHTML = `<p class="hint">Clique sur un objet pour le <b>ranger</b>. Tu récupères tout ce qu'il a coûté.</p>`;
  b.querySelectorAll('[data-col]').forEach(el => el.onclick = () => { selColor = el.dataset.col; renderToolBody(); });
  b.querySelectorAll('[data-item]').forEach(el => el.onclick = () => { selItem = el.dataset.item; selColor = ITEM[selItem].def; renderToolBody(); });
  b.querySelectorAll('[data-pat]').forEach(el => el.onclick = () => { selPat = el.dataset.pat; renderToolBody(); });
  if ($('flipBtn')) $('flipBtn').onclick = () => { flip = !flip; renderToolBody(); };
  if ($('clearMarks')) $('clearMarks').onclick = () => { marks.clear(); renderToolBody(); save(); };
}
function setTool(t) {
  tool = t;
  $('tools').querySelectorAll('.tool').forEach(el => el.classList.toggle('on', el.dataset.tool === t));
  renderToolBody();
}
function buildUI() {
  for (const k of Object.keys(ICONS)) ICON[k] = iconURL(k);
  [['icFaim', 'faim'], ['icJoie', 'joie'], ['icEnergie', 'energie'], ['icCompote', 'compote'], ['icPepin', 'pepin'], ['icCosy', 'cosy']].forEach(([id, k]) => $(id).src = ICON[k]);
  $('tools').innerHTML = TOOLS.map(([id, n], i) => `<button class="tool" data-tool="${id}" title="${n} (${i + 1})"><img src="${ICON[id]}" alt="">${n}</button>`).join('');
  $('tools').querySelectorAll('.tool').forEach(el => el.onclick = () => setTool(el.dataset.tool));
  $('wormColors').innerHTML = SW_KEYS.map(k => `<button data-wc="${k}" style="background:${SW[k][0]}" title="${k}"></button>`).join('');
  $('wormColors').querySelectorAll('button').forEach(el => el.onclick = () => { S.worm.color = el.dataset.wc; refreshUI(); save(); sfx('paint'); });
  const ACC = [['aucun', 'Aucun'], ['noeud', 'Nœud'], ['couronne', 'Couronne'], ['fleur', 'Fleur'], ['hennin', 'Hennin']];
  $('accs').innerHTML = ACC.map(([k, n]) => `<button class="chip" data-acc="${k}">${n}</button>`).join('');
  $('accs').querySelectorAll('.chip').forEach(el => el.onclick = () => { S.worm.acc = el.dataset.acc; refreshUI(); save(); sfx('pop'); say('heart', 1); });
  $('aFeed').onclick = feed; $('aPlay').onclick = play; $('aSleep').onclick = toggleSleep;
  $('name').oninput = () => { S.worm.name = $('name').value.trim() || 'Pépito'; save(); };
  $('mute').onclick = () => { S.muted = !S.muted; refreshUI(); save(); };
  $('reset').onclick = $('reset2').onclick = () => {
    if (!confirm('Recommencer une nouvelle partie ? Ta maison, ton ver et tes objets seront effacés.')) return;
    const muted = S.muted;
    S = freshSave(); S.muted = muted; grid = Int8Array.from(S.grid); marks = new Set();
    selItem = 'lampe'; selColor = 'rose'; flip = false; setTool('dig'); start();
  };
  setTool('dig');
}
let lastUI = '';
function refreshUI() {
  const st = S.stats;
  $('bFaim').style.width = st.faim + '%'; $('bJoie').style.width = st.joie + '%'; $('bEnergie').style.width = st.energie + '%';
  $('mood').textContent = mood();
  $('rCompote').textContent = S.res.compote; $('rPepin').textContent = S.res.pepin; $('rCosy').textContent = cosyScore;
  $('aSleep').firstChild.textContent = S.worm.sleeping ? 'Réveil' : 'Dodo';
  $('aSleep').querySelector('small').textContent = S.worm.sleeping ? 'debout !' : S.decor.some(d => d.id === 'lit') ? 'au lit !' : 'par terre';
  $('aFeed').disabled = S.res.compote < 1;
  $('mute').textContent = S.muted ? '♪ off' : '♪ on';
  $('wormColors').querySelectorAll('button').forEach(el => el.classList.toggle('on', el.dataset.wc === S.worm.color));
  $('accs').querySelectorAll('.chip').forEach(el => el.classList.toggle('on', el.dataset.acc === S.worm.acc));
  const key = tool + '|' + S.res.compote + '|' + S.res.pepin + '|' + marks.size;
  if (key !== lastUI && (tool === 'place' || tool === 'dig')) renderToolBody();
  lastUI = key;
}

/* ================= mise en page ================= */
function layout() {
  const wide = innerWidth >= 1000;
  const aw = (wide ? innerWidth - 272 * 2 - 22 * 2 - 32 : innerWidth - 32) - 84;
  const ah = (wide ? innerHeight - 54 - 22 : (innerHeight - 54) * 0.62) - 112;
  const s = Math.max(1, Math.floor(Math.min(aw / W, ah / H) * 4) / 4);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  document.documentElement.style.setProperty('--px', s + 'px');
  document.documentElement.style.setProperty('--grid', s >= 3 ? '.9' : '0');
}
addEventListener('resize', layout);

/* ================= boucle ================= */
let now = 0, last = 0, saveT = 4, uiT = 0, nightT = 30;
function updateWorm(dt) {
  wm.loveCd -= dt; wm.digCd -= dt;
  switch (wm.state) {
    case 'walk': if (stepWalk(dt)) arrive(); break;
    case 'munch':
      wm.timer -= dt;
      if (Math.random() < dt * 18) { const m = wm.job.mark; addP('crumb', (m % GW) * T + rnd(1, 7), ((m / GW) | 0) * T + rnd(1, 7), rnd(-20, 20), rnd(-30, 0), C.fleshS); }
      if (wm.timer <= 0) finishMunch();
      break;
    case 'sleep':
      if (Math.random() < dt * 0.9) addP('z', wm.x + wm.face * 2, wm.y - 7, rnd(2, 6) * wm.face, -10);
      if (S.stats.energie >= 100) wake('Bien dormi ! ☀️');
      break;
    case 'anim':
      wm.timer -= dt;
      if (wm.anim === 'play' && Math.random() < dt * 4) addP('note', wm.x + rnd(-6, 6), wm.y - 8, rnd(-6, 6), -18);
      if (wm.anim === 'eat' && Math.random() < dt * 14) addP('crumb', wm.x + wm.face * 4, wm.y, rnd(-15, 15), rnd(-25, -5), '#ffd9a0');
      if (wm.timer <= 0) setIdle(1);
      break;
    default:
      wm.timer -= dt;
      if (S.stats.energie < 4) { goSleep(); break; }
      if (marks.size && S.stats.energie > 6 && wm.digCd <= 0) { if (planDig()) break; wm.digCd = 1.5; }
      if (wm.timer <= 0) wander();
  }
  if ((wm.needT -= dt) <= 0 && wm.state !== 'sleep') { // il exprime ses besoins
    wm.needT = rnd(7, 11); const s = S.stats;
    if (s.faim < 30) say('apple'); else if (s.energie < 25) say('zzz'); else if (s.joie < 30) say('sad');
    else if (s.joie > 75 && Math.random() < 0.5) say(Math.random() < 0.5 ? 'heart' : 'note');
  }
}
function tick(dt) {
  now += dt;
  tickStats(dt);
  updateWorm(dt);
  if ((nightT -= dt) <= 0) { nightT = 30; checkNight(); }
  render(now, dt);
  if ((uiT -= dt) <= 0) { uiT = 0.25; refreshUI(); }
  if ((saveT -= dt) <= 0) { saveT = 4; save(); }
}
function frame(ts) {
  let dt = last ? (ts - last) / 1000 : 0.016; last = ts;
  if (dt > 2) { offline(dt); dt = 0.05; } // retour après un onglet en pause
  tick(Math.min(dt, 0.05));
  requestAnimationFrame(frame);
}
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

function start() {
  tilesDirty = true; computeCosy(); parts.length = 0;
  appleTop = 0; for (let y = 0; y < GH; y++) if (grid[y * GW + 15] !== OUT) { appleTop = y * T; break; }
  wm.face = 1; wm.bedRef = null;
  let tx = S.worm.x, ty = S.worm.y;
  if (!isEmpty(tx, ty)) { const i = grid.indexOf(EMPTY); tx = i % GW; ty = (i / GW) | 0; }
  placeWormAt(tx, ty); setIdle(1);
  if (S.worm.sleeping) {
    const bed = S.decor[S.worm.bed];
    if (bed && bed.id === 'lit') startSleep(bed); else wm.state = 'sleep';
  }
  $('name').value = S.worm.name;
  refreshUI(); renderToolBody();
  if (S.fresh) { S.fresh = false; setTimeout(() => toast('Bienvenue ! Clique les blocs autour pour creuser.'), 500); }
  else say('heart');
  save();
}

load();
computeCosy();
offline((Date.now() - (S.t || Date.now())) / 1000);
checkNight();
buildUI();
layout();
start();
requestAnimationFrame(frame);
</script>
  <script src="/retour.js" data-pos="tl" defer></script>
