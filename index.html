<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devtober 2026</title>
<style>
  :root{--bg:#0f0d0b;--card:#1b1714;--line:#2c2620;--text:#f3ebe1;--muted:#8b7f72;--accent:#ff7a1a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:48px 16px}
  main{max-width:880px;margin:0 auto}
  h1{font-size:clamp(2.2rem,7vw,4rem);margin:0;letter-spacing:-.03em}
  h1 span{color:var(--accent)}
  p.sub{color:var(--muted);margin:.5rem 0 2.5rem}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:inherit;min-width:0;transition:transform .15s,border-color .15s}
  .day .n{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .day .e{font-size:clamp(1.1rem,4vw,1.8rem);line-height:1}
  .day .t{font-size:.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a.day:hover{transform:translateY(-3px);border-color:var(--accent)}
  .day.done{border-color:#4a3524}
  .day.today{outline:2px solid var(--accent);outline-offset:2px}
  .day.future{opacity:.35}
  @media (max-width:520px){.day .t{display:none}.grid{gap:5px}.day{border-radius:8px;padding:5px}}
</style>
</head>
<body>
<main>
  <h1>Dev<span>tober</span> 2026</h1>
  <p class="sub">Un thème, un mini projet, chaque jour d'octobre.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
(async () => {
  const grid = document.getElementById('grid');
  const now = new Date();
  const today = (now.getFullYear() === 2026 && now.getMonth() === 9) ? now.getDate() : (now > new Date(2026, 9, 31) ? 32 : 0);
  const byDay = {};
  try {
    const dirs = (await (await fetch('/_themes/')).json()).filter(d => d.type === 'directory');
    await Promise.all(dirs.map(async d => {
      try {
        const m = await (await fetch(`/${d.name}/meta.json`)).json();
        byDay[m.day] = { ...m, slug: d.name };
      } catch {}
    }));
  } catch {}
  for (let i = 1; i <= 31; i++) {
    const p = byDay[i];
    const el = document.createElement(p ? 'a' : 'div');
    el.className = 'day' + (p ? ' done' : '') + (i === today ? ' today' : '') + (!p && i > today ? ' future' : '');
    if (p) el.href = `/${p.slug}/`;
    el.innerHTML = `<span class="n">${String(i).padStart(2, '0')}</span><span class="e">${p ? (p.emoji || '✦') : ''}</span><span class="t">${p ? p.title : ''}</span>`;
    grid.appendChild(el);
  }
})();
</script>
</body>
</html>
