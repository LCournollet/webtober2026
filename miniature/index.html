  #focus i { position: absolute; left: -4px; width: 12px; height: 2px; background: var(--brass); }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
let seed = 2026; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647, rr = (a, b) => a + (b - a) * R(), pick = a => a[(R() * a.length) | 0];
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* =========================================================================================
   1. Dehors : le microscope miniature sur le bureau
   ========================================================================================= */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#120d09');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 0.1, 200);
const HOME = { pos: new THREE.Vector3(17, 11, 20), target: new THREE.Vector3(0, 2.8, 0) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME.target); controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 9; controls.maxDistance = 34; controls.minPolarAngle = 0.25; controls.maxPolarAngle = 1.42;
controls.autoRotate = true; controls.autoRotateSpeed = 0.4;

// lumière : une fenêtre chaude d'un côté, un contre-jour froid de l'autre
const sun = new THREE.DirectionalLight('#ffe2b8', 3.2); sun.position.set(-9, 14, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = sun.shadow.camera.bottom = -10; sun.shadow.camera.right = sun.shadow.camera.top = 10; sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight('#9fb4d8', '#3a2414', 0.35));
const rim = new THREE.DirectionalLight('#a9c4ff', 1.3); rim.position.set(8, 6, -10); scene.add(rim);

const tex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
// bureau en noyer
const wood = tex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#5a3a24'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 300; i++) { const y = R() * h; g.strokeStyle = `rgba(${R() < 0.55 ? '30,16,8' : '140,96,60'},${rr(0.04, 0.14)})`; g.lineWidth = rr(1, 6);
    g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= w; x += 24) g.lineTo(x, y + Math.sin(x * 0.006 + i * 1.3) * rr(3, 14)); g.stroke(); }
});
wood.wrapS = wood.wrapT = THREE.RepeatWrapping; wood.repeat.set(2.5, 2.5);
const desk = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ map: wood, roughness: 0.45, metalness: 0 }));
desk.rotation.x = -Math.PI / 2; desk.receiveShadow = true; scene.add(desk);

// matières
const brass = new THREE.MeshPhysicalMaterial({ color: '#d6ac5e', metalness: 1, roughness: 0.28, clearcoat: 0.4, clearcoatRoughness: 0.2 });
const brassDark = new THREE.MeshPhysicalMaterial({ color: '#a8803c', metalness: 1, roughness: 0.42 });
const enamel = new THREE.MeshPhysicalMaterial({ color: '#141210', metalness: 0.1, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.06 });
const chrome = new THREE.MeshPhysicalMaterial({ color: '#e8e8ea', metalness: 1, roughness: 0.12 });
const glass = new THREE.MeshPhysicalMaterial({ color: '#ffffff', metalness: 0, roughness: 0.02, transmission: 1, thickness: 0.05, ior: 1.5 });
const scope = new THREE.Group(); scene.add(scope);
const add = (geo, mat, x = 0, y = 0, z = 0, parent = scope) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
const lathe = (pts, seg = 48) => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg);

// pied en fer à cheval, émaillé
{
  const s = new THREE.Shape(); s.absarc(0, 0, 2.3, -0.15 * Math.PI, 1.15 * Math.PI, false); s.absarc(0, 0, 1.15, 1.15 * Math.PI, -0.15 * Math.PI, true);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.42, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 4, curveSegments: 48 });
  g.rotateX(-Math.PI / 2); const foot = add(g, enamel, 0, 0.08, -0.35); foot.rotation.y = Math.PI;
  add(new THREE.CylinderGeometry(0.62, 0.7, 0.36, 40), brass, 0, 0.62, -1.75);           // socle du pilier
}
// pilier, charnière, bras en col de cygne
add(new THREE.CylinderGeometry(0.32, 0.36, 1.25, 32), enamel, 0, 1.38, -1.75);
add(new THREE.CylinderGeometry(0.42, 0.42, 0.9, 32).rotateZ(Math.PI / 2), brass, 0, 2.05, -1.75);   // charnière
{
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 2.05, -1.75), new THREE.Vector3(0, 3.0, -1.95), new THREE.Vector3(0, 4.4, -1.75), new THREE.Vector3(0, 5.6, -1.1), new THREE.Vector3(0, 6.1, -0.55)]);
  add(new THREE.TubeGeometry(curve, 64, 0.34, 24), enamel);
}
// platine avec la lame et ses valets
const STAGE_Y = 3.05;
add(new THREE.BoxGeometry(2.9, 0.16, 2.6), enamel, 0, STAGE_Y, -0.05);
add(new THREE.BoxGeometry(0.5, 0.5, 0.9), enamel, 0, STAGE_Y - 0.2, -1.4);              // support de platine
add(new THREE.BoxGeometry(2.4, 0.03, 0.8), glass, 0, STAGE_Y + 0.1, 0.25);
add(new THREE.SphereGeometry(0.22, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2).scale(1, 0.25, 1), new THREE.MeshPhysicalMaterial({ color: '#cfe8d8', roughness: 0.05, transmission: 0.85, thickness: 0.1 }), 0, STAGE_Y + 0.115, 0.25);
for (const s of [-1, 1]) { const clip = add(new THREE.BoxGeometry(0.16, 0.03, 0.9), brass, s * 0.95, STAGE_Y + 0.135, -0.1); clip.rotation.y = s * 0.25; add(new THREE.CylinderGeometry(0.07, 0.07, 0.08, 16), brass, s * 0.95, STAGE_Y + 0.14, -0.5); }
// lumière sous la platine (petite lampe à LED)
const lampGlow = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.4, 1.0), toneMapped: false });
add(lathe([[0, 0], [0.5, 0], [0.55, 0.12], [0.42, 0.3], [0, 0.32]]), brassDark, 0, 1.25, 0.25);
add(new THREE.CircleGeometry(0.32, 32).rotateX(-Math.PI / 2), lampGlow, 0, 1.58, 0.25);
const ledLight = new THREE.PointLight('#fff1d6', 2.5, 4, 2); ledLight.position.set(0, 2.2, 0.25); scope.add(ledLight);
// tourelle porte-objectifs et objectifs
const TUBE_X = 0, TUBE_Z = 0.25;
const turret = new THREE.Group(); turret.position.set(TUBE_X, 4.25, TUBE_Z); scope.add(turret);
add(lathe([[0, 0.25], [0.7, 0.2], [0.78, 0.05], [0.6, -0.12], [0, -0.14]]), chrome, 0, 0, 0, turret);
for (let i = 0; i < 3; i++) {
  const a = i / 3 * Math.PI * 2, o = new THREE.Group(); o.position.set(Math.sin(a) * 0.38, -0.1, Math.cos(a) * 0.38); o.rotation.set(Math.cos(a) * 0.32, 0, -Math.sin(a) * 0.32);
  const len = [0.55, 0.75, 0.95][i];
  add(lathe([[0.2, 0], [0.2, -len * 0.55], [0.16, -len * 0.75], [0.09, -len], [0, -len]]), chrome, 0, 0, 0, o);
  add(new THREE.CylinderGeometry(0.205, 0.205, 0.05, 24), new THREE.MeshStandardMaterial({ color: ['#c23b2b', '#e0b43a', '#3b6fc2'][i], roughness: 0.4 }), 0, -len * 0.3, 0, o);
  turret.add(o);
}
// tube optique, oculaire
add(lathe([[0.36, 0], [0.36, 1.6], [0.33, 1.7], [0.33, 1.95]]), enamel, TUBE_X, 4.45, TUBE_Z);
add(new THREE.CylinderGeometry(0.4, 0.4, 0.12, 32), brass, TUBE_X, 4.5, TUBE_Z);
add(new THREE.CylinderGeometry(0.38, 0.38, 0.1, 32), brass, TUBE_X, 5.95, TUBE_Z);
const EYE_Y = 6.85;
const eyepiece = add(lathe([[0.22, 0], [0.22, 0.6], [0.3, 0.66], [0.3, 0.86], [0.2, 0.88]]), brass, TUBE_X, 6.0, TUBE_Z);
const eyeLens = add(new THREE.CircleGeometry(0.2, 32).rotateX(-Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: '#7fa6b8', metalness: 0.3, roughness: 0.05, clearcoat: 1, iridescence: 0.6 }), TUBE_X, 6.875, TUBE_Z);
// bras qui tient le tube + crémaillère
add(new THREE.BoxGeometry(0.5, 1.2, 0.5), enamel, TUBE_X, 5.3, TUBE_Z - 0.55);
// molettes de mise au point (macro + micro), de chaque côté
const knobs = [];
for (const s of [-1, 1]) {
  knobs.push(add(lathe([[0, 0], [0.55, 0], [0.58, 0.04], [0.58, 0.22], [0.55, 0.26], [0, 0.26]]).rotateZ(-s * Math.PI / 2), brass, s * 0.45, 2.05, -1.75));
  knobs.push(add(lathe([[0, 0], [0.3, 0], [0.3, 0.2], [0, 0.2]]).rotateZ(-s * Math.PI / 2), brassDark, s * 0.72, 2.05, -1.75));
}
// plaquette gravée sur le pied
const badge = tex(512, 128, (g, w, h) => {
  g.fillStyle = '#d4ad62'; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(60,40,10,.85)'; g.textAlign = 'center';
  g.font = 'italic 600 54px "Cormorant Garamond", serif'; g.fillText('Lumen & Fils', w / 2, 62); g.font = '500 22px "JetBrains Mono", monospace'; g.fillText('PARIS · N° 0003 · 1:12', w / 2, 104);
});
add(new THREE.PlaneGeometry(1.4, 0.35), new THREE.MeshStandardMaterial({ map: badge, metalness: 0.9, roughness: 0.3 }), 0, STAGE_Y, 1.251);   // plaquette sur le chant de la platine

// pièce de monnaie et trombone posés à côté : ce sont eux qui racontent l'échelle
let coinTex;
{
  coinTex = tex(512, 512, () => {});
  const coin = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.6, 0.42, 96), [new THREE.MeshStandardMaterial({ color: '#b08a3a', metalness: 1, roughness: 0.35 }), new THREE.MeshStandardMaterial({ map: coinTex, metalness: 1, roughness: 0.3 }), brassDark]);
  coin.position.set(7.8, 0.21, -1.5); coin.rotation.y = 0.6; coin.castShadow = coin.receiveShadow = true; scene.add(coin);
  const P = (x, z) => new THREE.Vector3(x, 0.12, z);
  const pts = [P(0, 0), P(9, 0), P(9.6, 0.9), P(9, 1.8), P(-0.6, 1.8), P(-1.2, 0.9), P(-0.6, 0.15), P(8, 0.15), P(8.4, 0.9), P(8, 1.4), P(1, 1.4)];
  const clip = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 200, 0.12, 12), chrome);
  clip.position.set(-12, 0, 2); clip.rotation.y = 0.5; clip.castShadow = true; scene.add(clip);
}
const paintLabels = () => {
  const g = badge.image.getContext('2d'), w = 512, h = 128; g.fillStyle = '#d4ad62'; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(60,40,10,.85)'; g.textAlign = 'center';
  g.font = 'italic 600 54px "Cormorant Garamond", serif'; g.fillText('Lumen & Fils', w / 2, 62); g.font = '500 22px "JetBrains Mono", monospace'; g.fillText('PARIS · N° 0003 · 1:12', w / 2, 104); badge.needsUpdate = true;
  const c = coinTex.image.getContext('2d'), W = 512; const gr = c.createRadialGradient(W * 0.4, W * 0.35, 20, W / 2, W / 2, W / 2); gr.addColorStop(0, '#f0d58e'); gr.addColorStop(1, '#a8812f'); c.fillStyle = gr; c.fillRect(0, 0, W, W);
  c.strokeStyle = 'rgba(80,55,10,.6)'; c.lineWidth = 10; c.beginPath(); c.arc(W / 2, W / 2, W / 2 - 30, 0, 7); c.stroke();
  c.fillStyle = 'rgba(80,55,10,.75)'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '600 220px "Cormorant Garamond", serif'; c.fillText('1', W / 2, W / 2 + 10);
  c.font = '500 30px "JetBrains Mono", monospace'; for (let i = 0; i < 12; i++) { c.save(); c.translate(W / 2, W / 2); c.rotate(i / 12 * Math.PI * 2); c.fillText('★', 0, -W / 2 + 62); c.restore(); }
  coinTex.needsUpdate = true;
};
paintLabels(); document.fonts.ready.then(paintLabels);

/* ---------- post-traitement : léger tilt-shift + grain ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const tilt = dir => new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uDir: { value: dir }, uFocus: { value: 0.5 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uDir, uRes; uniform float uFocus; varying vec2 vUv;
    void main(){ float d = max(0., abs(vUv.y - uFocus) - .16), r = clamp(d * 3., 0., 1.) * 7. * uRes.y / 900.;
      vec4 a = vec4(0.); float ws = 0.; for (int i = -7; i <= 7; i++) { float t = float(i) / 7., w = exp(-t * t * 2.); a += texture2D(tDiffuse, vUv + uDir * t * r / uRes) * w; ws += w; }
      gl_FragColor = a / ws; }`,
});
const tiltH = tilt(new THREE.Vector2(1, 0)), tiltV = tilt(new THREE.Vector2(0, 1));
composer.addPass(tiltH); composer.addPass(tiltV); composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uSeed: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uSeed; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uSeed) * 43758.5453); }
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; float l = dot(c, vec3(.299,.587,.114)); c = mix(vec3(l), c, 1.12);
      vec2 q = vUv - .5; c *= 1. - dot(q, q) * .85; c += (h(vUv * 917.) - .5) * .04; gl_FragColor = vec4(clamp(c, 0., 1.), 1.); }`,
});
composer.addPass(grade);

/* =========================================================================================
   2. Dedans : une goutte d'eau de mare, en lumière transmise (canvas 2D)
   ========================================================================================= */
const mc = $('micro'), mx = mc.getContext('2d');
let MW = 0, MH = 0, MD = 1;
const sizeMicro = () => { MD = Math.min(devicePixelRatio, 1.5); mc.width = innerWidth * MD; mc.height = innerHeight * MD; MW = mc.width; MH = mc.height; };
sizeMicro();
const WORLD = 2000;                                       // la lame, en micromètres « de jeu », qui boucle sur elle-même
const MAGS = [{ k: 1, label: '×40' }, { k: 2.4, label: '×100' }, { k: 6, label: '×400' }];
const view = { x: 0, y: 0, k: 1, kT: 1, focus: 0.5, focusT: 0.5 };
const wrapD = d => ((d % WORLD) + WORLD * 1.5) % WORLD - WORLD / 2;
const nz = (a, t, s) => Math.sin(a * 3 + t * 0.9 + s) * 0.5 + Math.sin(a * 5 - t * 1.3 + s * 2) * 0.3 + Math.sin(a * 2 + t * 0.4 + s * 3) * 0.6;

const orgs = [];
const spawn = (type, n, f) => { for (let i = 0; i < n; i++) orgs.push(Object.assign({ type, x: rr(-WORLD / 2, WORLD / 2), y: rr(-WORLD / 2, WORLD / 2), z: rr(0.15, 0.85), a: rr(0, 6.28), s: R() * 100, t: 0 }, f ? f() : {})); };
spawn('bubble', 5, () => ({ r: rr(40, 110), z: rr(0.3, 0.9) }));
spawn('debris', 14, () => ({ r: rr(20, 70), pts: Array.from({ length: 9 }, () => rr(0.5, 1.1)), col: pick(['rgba(110,90,60,', 'rgba(80,95,60,', 'rgba(120,110,90,']) }));
spawn('diatom', 34, () => ({ len: rr(60, 110), centric: R() < 0.35, v: rr(4, 10) * (R() < 0.5 ? 1 : -1) }));
spawn('paramecium', 16, () => ({ len: rr(110, 150), v: rr(45, 70), turn: 0 }));
spawn('euglena', 22, () => ({ len: rr(70, 95), v: rr(25, 40) }));
spawn('amoeba', 4, () => ({ r: rr(80, 120), v: rr(4, 7), gran: Array.from({ length: 70 }, () => [R() * 6.28, Math.sqrt(R()) * 0.8, rr(1.5, 3.5)]) }));
spawn('volvox', 3, () => ({ r: rr(120, 170), v: rr(8, 14), dots: Array.from({ length: 160 }, () => { const u = rr(-1, 1), a = R() * 6.28; return [Math.sqrt(1 - u * u) * Math.cos(a), Math.sqrt(1 - u * u) * Math.sin(a), u]; }), kids: Array.from({ length: 3 + (R() * 3 | 0) }, () => [rr(-0.45, 0.45), rr(-0.45, 0.45), rr(0.18, 0.28)]) }));

    camera.position.lerpVectors(anim.p0, anim.p1, e); controls.target.lerpVectors(anim.t0, anim.t1, e); camera.lookAt(controls.target);
    if (anim.k >= 1) { const d = anim.done; anim = null; d(); } }
  else if (!inside) controls.update(dt);
  turret.rotation.y += (turretT - turret.rotation.y) * (1 - Math.exp(-6 * dt));
  ledLight.intensity = inside || anim ? 4 : 2.5;
  view.k += (view.kT - view.k) * (1 - Math.exp(-5 * dt)); view.focus += (view.focusT - view.focus) * (1 - Math.exp(-8 * dt));
  $('focus').querySelector('i').style.top = (view.focus * 158) + 'px';
  knobs.forEach((k, i) => k.rotation.x = view.focus * 6 * (i % 2 ? 3 : 1));
  if (inside) stepOrgs(dt);
}
function render() {
  if (inside) { drawMicro(0, 0, 1); return; }
  grade.uniforms.uSeed.value = R() * 100;
  composer.render();
}
function frame() {
  requestAnimationFrame(frame);
  update(Math.min(clock.getDelta(), 0.1)); render();
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  [tiltH, tiltV].forEach(p => p.uniforms.uRes.value.set(innerWidth, innerHeight)); sizeMicro();
});
camera.lookAt(controls.target);
stepOrgs(0.01);
frame();
document.fonts.ready.then(() => requestAnimationFrame(() => $('intro').classList.add('gone')));
</script>
